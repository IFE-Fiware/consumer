    path: ''
    targetRevision: {{ .Values.contract_consumption_be.targetRevision }}
    chart: {{ .Values.contract_consumption_be.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.contract_consumption_be.valueFiles }}
        - $values/app-values/contract-consumption-be/{{ . }}
        {{- end }}
      values: |
        domain: {{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        # edcConsumer:
        #   baseUrl: http://simpl-edc-service.{{ .Values.cluster.namespace }}.svc.cluster.local:29193
        connectorAdapter:
          tier1Gateway:
            url: https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/edc-connector-adapter
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"              
        {{- else }}
          {{- if .Values.contract_consumption_be.resources }}
        resources: {{- toYaml .Values.contract_consumption_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}

        openapiConfig:
          servers: https://creation-wizard-api.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
