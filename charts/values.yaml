project: ${PROJECT}
namespaceTag: ${NAMESPACETAG}
authority:
  namespaceTag: ${AUTHNAMESPACETAG}
domainSuffix: ${DOMAINSUFFIX}

argocd:
  appname: ${NAMESPACE}
  namespace: argocd

cluster:
  address: https://kubernetes.default.svc
  namespace: ${NAMESPACE}
  commonToolsNamespace: ${COMMONNAMESPACE}

hashicorp:
  service: "http://vault.namespace.svc.cluster.local:8200"
  secretEngine: ${SECRETENGINE}
  role: dev-int-role

values:
  repo_URL: https://code.europa.eu/simpl/simpl-open/development/agents/consumer.git
  branch: develop

postgresql:
  repo_URL: https://charts.bitnami.com/bitnami
  chart_name: postgresql
  targetRevision: 15.2.5
  nameOverride: postgresql
  primary:
    resourcesPreset: "none"
    resources:
      requests:
        cpu: "0"
        memory: "0"
  valueFiles:
    - values.yaml
    - values-participant.yaml

keycloak:
  repo_URL: https://charts.bitnami.com/bitnami
  chart_name: keycloak
