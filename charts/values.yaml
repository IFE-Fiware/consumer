authority:
  namespaceTag: ${AUTHNAMESPACETAG}
  keycloakClientID: "federated-catalogue"
  keycloakSecret: ${AUTHKEYCLOAKSECRET}

argocd:
  appname: ${NAMESPACE}
  namespace: argocd

project: default

cluster:
  address: https://kubernetes.default.svc
  namespace: ${NAMESPACE}
  kubeStateHost: kube-prometheus-stack-kube-state-metrics.devsecopstools.svc.cluster.local:8080

namespaceTag: ${NAMESPACETAG}
domainSuffix: ${DOMAINSUFFIX}

values:
  repo_URL: https://code.europa.eu/simpl/simpl-open/development/agents/consumer.git
  branch: develop

postgresql:
  repo_URL: https://charts.bitnami.com/bitnami
  chart_name: postgresql
  targetRevision: v15.2.5
  nameOverride: postgresql
  valueFiles:
    - values.yaml
    - values-participant.yaml

keycloak:
  repo_URL: https://charts.bitnami.com/bitnami
  chart_name: keycloak
  targetRevision: "22.2.5"
  nameOverride: keycloak
  valueFiles:
    - values.yaml

redis:
  repo_URL: 'https://charts.bitnami.com/bitnami'
  targetRevision: 19.6.0
  chart_name: redis
  nameOverride: redis
  valueFiles:
    - values.yaml

simpl_catalogue_client:
